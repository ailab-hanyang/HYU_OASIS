# ════════════════════════════════════════════════════════════════════════════
# experiments.yml — experiment registry read by run/run_experiment.py
#
# Run an experiment:
#     PYTHONPATH=. python run/run_experiment.py --exp_name <your_experiment>
#
# Add one top-level entry per experiment. Keys:
#   name         experiment id → results saved to output/sm_predictions/<name>/
#   LLM          subdir under output/llm_code_predictions/RefAV/ 
#   tracker      subdir under output/tracker_predictions/ (holds sm_annotations.feather)
#   split        val | test           (train is accepted; only val/train are scored)
#   context      RefAV | NuPrompt     (optional, default: RefAV)
#   multi_agent  true | false         (optional, default: false)
#
# Example — copy this block, uncomment it, and replace every <...> placeholder:
#
# my_experiment:
#   name: my_experiment
#   LLM: <llm_prediction_dir>
#   split: val
#   tracker: <tracker_dir>
#   context: RefAV
#   multi_agent: false
# ════════════════════════════════════════════════════════════════════════════

# Allowed values referenced by run_experiment.py. Replace the <...> placeholders
# with the directory names that exist in your output/ tree (extend the lists freely).
LLM:
- <llm_prediction_dir>

context:
- RefAV
- NuPrompt

split:
- val
- test

tracker:
- <tracker_dir>
